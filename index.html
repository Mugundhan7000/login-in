```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureHub Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;

            padding: 35px;

            border-radius: 10px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            width: 110px;
            height: 110px;

            object-fit: contain;

            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
            color: #222;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 5px;

            background: #1877f2;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .demo {
            margin-top: 20px;

            font-size: 12px;

            color: #777;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <img src="logo.png"
             class="logo"
             alt="SecureHub Logo">

        <h2>Login</h2>

        <form onsubmit="return demoLogin()">

            <input
                type="text"
                placeholder="Username"
                autocomplete="off"
                required>

            <input
                type="password"
                placeholder="Password"
                autocomplete="off"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="demo">
            Cybersecurity Assignment Demo
        </p>

    </div>

    <script>

        function demoLogin() {

            alert("Demo only. No credentials are stored.");

            return false;
        }

    </script>

</body>

</html>
```
